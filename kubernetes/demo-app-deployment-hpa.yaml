# kubernetes/demo-app-deployment-hpa.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-movie-app
  labels:
    app: demo-movie-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-movie-app
  template:
    metadata:
      labels:
        app: demo-movie-app
    spec:
      containers:
      - name: demo-movie-app
        image: impof/demo-app:latest
        ports:
        - containerPort: 4000
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: demo-movie-app-service
spec:
  type: ClusterIP
  selector:
    app: demo-movie-app
  ports:
  - port: 4000
    targetPort: 4000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: demo-movie-app-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: demo-movie-app
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
