# monitoring/prometheus/prometheus.yml
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'impof-platform-backend'
    static_configs:
      - targets: ['backend:5000']

  - job_name: 'impof-demo-movie-app'
    static_configs:
      - targets: ['demo-app:4000']
        labels:
          service_id: 'APP-001'
          environment: 'production'
